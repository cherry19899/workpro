    <title>Work Pro - Freelance on Pi</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <!-- Pi Mock for testing: add ?mock=1 to URL ONLY -->
    <script src="https://cdn.jsdelivr.net/npm/pi-mock@latest/pi-mock.js"></script>
    <script>
      // Only enable mock when explicitly requested via ?mock=1
      if (window.location.search.includes('mock=1')) {
        if (typeof PiMock !== 'undefined') {
          PiMock({
            user: { uid: 'test123', username: 'testuser' },
            payment: { amount: 1, memo: 'Test payment' }
          });
          console.log('[PiMock] Enabled via ?mock=1');
        }
      }

      // Initialize Pi SDK when ready
      function initPiSdk() {
        if (typeof Pi !== 'undefined') {
          try {
            Pi.init({ version: "2.0" });
            console.log('[Pi] SDK init OK');
            return true;
          } catch (e) {
            console.error('[Pi] Init error:', e.message);
            return true;
          }
        }
        return false;
      }

      if (!initPiSdk()) {
        // Retry in case script loads async
        let retries = 0;
        const interval = setInterval(function() {
          retries++;
          if (initPiSdk() || retries > 10) {
            clearInterval(interval);
            if (retries > 10 && typeof Pi === 'undefined') {
              console.error('[Pi] SDK failed to load after retries');
            }
          }
        }, 300);
      }
    </script>
